<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Форма регистрации</title>
</head>
<body>
<h1>Регистрация в системе</h1>
<div>

<form class="login_form" method="post">

    <div>
    <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Введите Е-mail" name="email">
        </div>
    <div>
    <input type="password" class="form-control" id="password" aria-describedby="emailHelp" placeholder="Введите пароль" name="password">
        </div>
<!--    <input type="hidden">-->
<!--    <input type="checkbox">-->
<!--    <input type="button" value="кнопка">-->
    <lable for="levelSelect" class="form-control">Уровень владения ПК</lable>
    <select name="level" id="levelSelect">
        <option>Высокий</option>
        <option>Средний</option>
        <option>Низкий</option>
    </select>
    <div class="form-group">
        <label for = "about">Раскожите оп себе</label>
        <textarea class = "form-control" rows ="5" id="about" name="about"></textarea>

    </div>
    <div class="form-group" id="form-group">
        <label for = "form-group">укажите пол</label>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="male" value="М" checked>
            <label class="form-check-label" for="male">Мужской</label>

        </div>
    <div class="form-check">
            <input class="form-check-input" type="radio" name="gender" id="female" value="Ж" checked>
            <label class="form-check-label" for="female">Женский</label>

        </div>
    </div>
    <div class="form-group form-check">
        <input class="form-check-input" type="checkbox" name ="accept" id="acceptRules">
        <label class=class="form-check-label" for ="acceptRules">cогласен с правилами</label>
    </div>
    <div>
        <button type="submit" class="button button-primary">Отправить</button>
    </div>
</form >
</div>
</body>
</html>
