<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Форма регистрации</title>
</head>
<body>
<h1 class="login_form">Регистрация в системе</h1>
<div>
    <form class="login_form" method="post">
        <div style="margin-bottom: 15px;">
            <input type="email" class="form-control" id="email" aria-describedby="emailHelp"
                   placeholder="Введите E-mail" value="a@b.ru"
                   name="email">
        </div>
        <div>
            <input type="password" class="form-control" id="password" placeholder="Введите пароль" name="password">
        </div>
        <label for="levelSelect">Уровень владения ПК</label>
        <select class="form-control" name="level" id="levelSelect">
            <option>Высокий</option>
            <option>Средний</option>
            <option>Низкий</option>
        </select>
        <div class="form-group">
            <label for="about">Расскажите о себе</label>
            <textarea class="form-control" rows="5" id="about" name="about"></textarea>
        </div>
        <!-- Здесь будут радиокнопки выбора пола -->
        <div class="form-group" id="form-group">
            <label for="form-group">Укажите пол</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="male" value="М" checked>
                <label class="form-check-label" for="male">Мужской</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="female" value="Ж" checked>
                <label class="form-check-label" for="female">Женский</label>
            </div>
        </div>
        <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" name="accept" id="acceptRules">
            <label class="form-check-label" for="acceptRules">Согласен с правилами</label>
        </div>
        <div>
            <input type="submit" value="Запушить" class="button button-primary">
        </div>
    </form>
</div>
</body>
</html>
