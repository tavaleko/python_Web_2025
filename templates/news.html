{% extends "base.html" %}

{% block content %}
<h1>Новости</h1>
{% if current_user.is_authenticated %}
<a href="/newsjob" class="btn btn-secondary btn-sm my-1">
    Добавить новость
</a>
{% endif %}
{% for item in news %}
<div class="row">
    <div class="col border rounded">
        <h2>{{ item.title }}</h2>
        <p>{{item.content}}</p>
        <div>Автор: {{item.user.name}}</div>
    </div>
</div>
{% endfor %}
{% endblock %}
